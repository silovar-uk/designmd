name: Check DesignMD Next

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/designmd-system-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
